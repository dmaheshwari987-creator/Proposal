<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Hey Nidhi ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ffdde1,#ee9ca7);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Music Button */
.music-btn{
    position:fixed;
    top:20px;
    right:20px;
    background:white;
    border:none;
    width:50px;
    height:50px;
    border-radius:50%;
    font-size:24px;
    cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
    z-index:100;
    transition:0.3s;
}

.music-btn:hover{
    transform:scale(1.1);
}

/* Floating Hearts */

.heart{
    position:absolute;
    bottom:-20px;
    color:rgba(255,255,255,0.7);
    animation:floatUp linear infinite;
    user-select:none;
}

@keyframes floatUp{
    from{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }
    to{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
    }
}

/* Main Card */

.card{
    width:90%;
    max-width:500px;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(12px);
    border-radius:30px;
    padding:45px 25px;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,0.2);
    position:relative;
    z-index:10;
}

/* Text */

h1{
    font-size:34px;
    color:white;
    margin-bottom:18px;
}

.subtitle{
    color:white;
    font-size:16px;
    margin-bottom:35px;
    line-height:1.7;
}

/* Buttons */

.btn-container{
    position:relative;
    height:100px;
    display:flex;
    justify-content:center;
    gap:20px;
}

button{
    border:none;
    padding:15px 30px;
    border-radius:50px;
    font-size:20px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

#yesBtn{
    background:white;
    color:#ff4081;
}

#yesBtn:hover{
    transform:scale(1.1);
}

#noBtn{
    background:#ff4081;
    color:white;
    position:absolute;
}

/* Success Screen */

.success-screen{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#ff5f6d,#ffc371);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    color:white;
    z-index:999;
    animation:fadeIn 1s ease;
    padding:20px;
}

@keyframes fadeIn{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

.success-screen h1{
    font-size:50px;
    margin-bottom:15px;
}

.success-screen p{
    font-size:22px;
    max-width:600px;
    line-height:1.7;
}

/* Confetti */

.confetti{
    position:absolute;
    width:12px;
    height:12px;
    animation:fall linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-100px) rotate(0deg);
    }
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}

/* Mobile */

@media(max-width:500px){

    h1{
        font-size:28px;
    }

    .subtitle{
        font-size:15px;
    }

    button{
        padding:14px 24px;
        font-size:18px;
    }

    .btn-container{
        flex-direction:column;
    }

    .music-btn{
        width:45px;
        height:45px;
        font-size:20px;
    }
}

</style>
</head>

<body>

<!-- Background Music -->
<button class="music-btn" id="musicBtn" title="Play Music">🔊</button>
<audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=romantic-background-112997.mp3" type="audio/mpeg">
</audio>

<!-- Floating Hearts -->

<script>

for(let i=0;i<35;i++){

    const heart=document.createElement("div");

    heart.className="heart";
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*25+15)+"px";
    heart.style.animationDuration=(Math.random()*8+5)+"s";
    heart.style.animationDelay=Math.random()*5+"s";

    document.body.appendChild(heart);
}

</script>

<!-- Main Card -->

<div class="card">

    <h1>Hey Nidhi ❤️</h1>

    <div class="subtitle">
        From the day you entered my life,
        everything became beautiful.
        <br><br>
        And now I just have one question...
    </div>

    <h1 style="font-size:30px;">
        Will You Marry Me? 💍
    </h1>

    <div class="btn-container">

        <button id="yesBtn">
            Yes ❤️
        </button>

        <button id="noBtn">
            No 😢
        </button>

    </div>

</div>

<script>

/* Music Button */
const musicBtn = document.getElementById("musicBtn");
const bgMusic = document.getElementById("bgMusic");
let isPlaying = false;

musicBtn.addEventListener("click", () => {
    if (isPlaying) {
        bgMusic.pause();
        musicBtn.innerHTML = "🔇";
        isPlaying = false;
    } else {
        bgMusic.play();
        musicBtn.innerHTML = "🔊";
        isPlaying = true;
    }
});

/* Auto play on page interaction */
document.addEventListener("click", () => {
    if (!isPlaying) {
        bgMusic.play();
        musicBtn.innerHTML = "🔊";
        isPlaying = true;
    }
}, { once: true });

/* No Button Logic */

const noBtn = document.getElementById("noBtn");
const btnContainer = document.querySelector(".btn-container");
const containerRect = btnContainer.getBoundingClientRect();

function moveButton(e){
    // Prevent the click from triggering other events
    if(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    const padding = 50;
    const maxX = window.innerWidth - noBtn.offsetWidth - padding;
    const minX = padding;
    const maxY = window.innerHeight - noBtn.offsetHeight - padding;
    const minY = padding;

    const x = Math.random() * (maxX - minX) + minX;
    const y = Math.random() * (maxY - minY) + minY;

    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

// Move button on hover
noBtn.addEventListener("mouseenter", moveButton);

// Move button on click (don't disappear)
noBtn.addEventListener("click", function(e) {
    moveButton(e);
});

/* Yes Button */

document.getElementById("yesBtn").addEventListener("click",()=>{

    document.body.innerHTML=`

    <div class="success-screen">

        <h1>YAYYYY ❤️</h1>

        <p>
            This is officially the best day of my life 😭💍
            <br><br>
            I promise to love you,
            support you,
            annoy you,
            and stay with you forever.
        </p>

    </div>
    `;

    createConfetti();
});

/* Confetti */

function createConfetti(){

    for(let i=0;i<250;i++){

        const conf=document.createElement("div");

        conf.className="confetti";

        conf.style.left=Math.random()*100+"vw";
        conf.style.top="-20px";

        conf.style.background=
        `hsl(${Math.random()*360},100%,50%)`;

        conf.style.animationDuration=
        (Math.random()*3+2)+"s";

        document.body.appendChild(conf);
    }
}

</script>

</body>
</html>
