<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Hey Nidhi ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ffdde1,#ee9ca7);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Floating Hearts */

.heart{
    position:fixed;
    bottom:-20px;
    color:rgba(255,255,255,0.7);
    animation:floatUp linear infinite;
    user-select:none;
    pointer-events:none;
}

@keyframes floatUp{
    from{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }
    to{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
    }
}

/* Main Card */

.card{
    width:90%;
    max-width:500px;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(12px);
    border-radius:30px;
    padding:45px 25px;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,0.2);
    position:relative;
    z-index:10;
}

/* Text */

h1{
    font-size:34px;
    color:white;
    margin-bottom:18px;
}

.subtitle{
    color:white;
    font-size:16px;
    margin-bottom:35px;
    line-height:1.7;
}

/* Buttons */

.btn-container{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:40px;
}

button{
    border:none;
    padding:15px 35px;
    border-radius:50px;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:all 0.3s ease;
}

#yesBtn{
    background:white;
    color:#ff4081;
}

#yesBtn:hover{
    transform:scale(1.1);
    box-shadow:0 5px 20px rgba(255,64,129,0.4);
}

#noBtn{
    background:#ff4081;
    color:white;
}

/* Success Screen */

.success-screen{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#ff5f6d,#ffc371);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    color:white;
    z-index:999;
    animation:fadeIn 1s ease;
    padding:20px;
}

@keyframes fadeIn{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

.success-screen h1{
    font-size:50px;
    margin-bottom:15px;
}

.success-screen p{
    font-size:22px;
    max-width:600px;
    line-height:1.7;
}

/* Confetti */

.confetti{
    position:fixed;
    width:12px;
    height:12px;
    animation:fall linear forwards;
    pointer-events:none;
}

@keyframes fall{
    from{
        transform:translateY(-100px) rotate(0deg);
    }
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}

/* Mobile */

@media(max-width:600px){

    h1{
        font-size:28px;
    }

    .subtitle{
        font-size:14px;
    }

    button{
        padding:12px 24px;
        font-size:16px;
    }

    .btn-container{
        gap:15px;
    }
}

</style>
</head>

<body>

<!-- Floating Hearts -->

<script>

for(let i=0;i<35;i++){

    const heart=document.createElement("div");

    heart.className="heart";
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*25+15)+"px";
    heart.style.animationDuration=(Math.random()*8+5)+"s";
    heart.style.animationDelay=Math.random()*5+"s";

    document.body.appendChild(heart);
}

</script>

<!-- Main Card -->

<div class="card">

    <h1>Hey Nidhi ❤️</h1>

    <div class="subtitle">
        From the day you entered my life,
        everything became beautiful.
        <br><br>
        And now I just have one question...
    </div>

    <h1 style="font-size:30px;">
        Will You Marry Me? 💍
    </h1>

    <div class="btn-container">

        <button id="yesBtn">
            Yes ❤️
        </button>

        <button id="noBtn">
            No 😢
        </button>

    </div>

</div>

<script>

/* No Button - Escape when hovered or clicked */

const noBtn = document.getElementById("noBtn");

function escapeButton() {
    const btnWidth = 120;
    const btnHeight = 50;
    
    let randomX, randomY;
    let attempts = 0;
    
    do {
        randomX = Math.random() * (window.innerWidth - btnWidth);
        randomY = Math.random() * (window.innerHeight - btnHeight);
        attempts++;
    } while ((randomX < 50 || randomX > window.innerWidth - btnWidth - 50 || 
              randomY < 50 || randomY > window.innerHeight - btnHeight - 50) && attempts < 10);
    
    noBtn.style.position = "fixed";
    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
}

// Move on hover
noBtn.addEventListener("mouseover", (e) => {
    e.preventDefault();
    escapeButton();
});

// Move on click
noBtn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    escapeButton();
});

// Prevent accidental submission
noBtn.addEventListener("submit", (e) => {
    e.preventDefault();
});

/* Yes Button */

document.getElementById("yesBtn").addEventListener("click", () => {

    document.body.innerHTML = `
    <div class="success-screen">
        <h1>YAYYYY ❤️</h1>
        <p>
            This is officially the best day of my life 😭💍
            <br><br>
            I promise to love you,
            support you,
            annoy you,
            and stay with you forever.
        </p>
    </div>
    `;

    createConfetti();
});

/* Confetti */

function createConfetti() {
    for(let i = 0; i < 250; i++) {
        const conf = document.createElement("div");
        conf.className = "confetti";
        conf.style.left = Math.random() * 100 + "vw";
        conf.style.top = "-20px";
        conf.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
        conf.style.animationDuration = (Math.random() * 3 + 2) + "s";
        document.body.appendChild(conf);
    }
}

</script>

</body>
</html>
